name: CI and Docker Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run ShellCheck linter
        uses: ludeeus/action-shellcheck@master
      - name: Run unit test
        run: |
          chmod +x app_calculator.sh
          ./app_calculator.sh 5 10

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker Image
        run: |
          docker build -t my-app:${{ github.sha }} .
      - name: Test Docker Container
        run: |
          docker run -d -p 8080:8080 --name test_app my-app:${{ github.sha }}
          sleep 2
          curl --fail http://localhost:8080 || exit 1

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Ansible Lint
        uses: ansible/ansible-lint@v6
        with:
          args: ansible_iac/setup_env.yml

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Validate Docker Compose file
        run: |
          cd monitoring
          docker compose config

  k8s-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
      - name: Validate K8s manifests
        run: |
          cd k8s
          # Просто проверяем синтаксис YAML без подключения к кластеру
          kubectl apply --dry-run=client --validate=false -f deployment.yaml
          kubectl apply --dry-run=client --validate=false -f service.yaml
